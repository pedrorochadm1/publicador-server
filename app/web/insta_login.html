<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Automações · @pedrorochadm1</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  :root { --fg:#161823; --muted:#5b6068; --line:#e7e9ec; --accent:#d62976; --soft:#f7f8fa; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; color:var(--fg);
         background:var(--soft); padding:20px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:32px;
          width:100%; max-width:380px; box-shadow:0 4px 24px rgba(0,0,0,.05); }
  h1 { font-size:20px; margin:0 0 4px; }
  p.sub { color:var(--muted); font-size:14px; margin:0 0 24px; }
  label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
  input { width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px;
          font-size:16px; background:var(--soft); }
  input:focus { outline:2px solid var(--accent); background:#fff; }
  button { width:100%; margin-top:16px; padding:13px; border:0; border-radius:10px; background:var(--accent);
           color:#fff; font-size:15px; font-weight:700; cursor:pointer; }
  .erro { color:#c02b3a; font-size:14px; margin:12px 0 0; }
</style>
</head>
<body>
  <form class="card" method="post" action="/insta/login">
    <h1>Automações</h1>
    <p class="sub">@pedrorochadm1 · comentário → resposta + direct</p>
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" autofocus>
    <!--ERRO-->
    <button type="submit">Entrar</button>
  </form>
</body>
</html>
